plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.sysnova.bracnurseryapp"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.sysnova.bracnurseryapp'
}

dependencies {
    implementation files('libs/httpclient-4.2.3.jar')
    implementation files('libs/postgresql-9.1-901.jdbc3.jar')
    implementation files('libs/apache-httpcomponents-httpcore.jar')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation'commons-logging:commons-logging-api:1.1'
    implementation files('libs/ftp4j-1.7.jar')
    implementation files('libs/gson-2.2.2.jar')
    implementation files('libs/java-json.jar')
    implementation 'com.github.dhaval2404:imagepicker:2.1'
}